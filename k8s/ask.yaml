apiVersion: apps/v1
kind: Deployment
metadata:
  name: ask
  labels: { app: ask }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ask }
  template:
    metadata:
      labels: { app: ask }
    spec:
      containers:
        - name: api
          image: ask-llmd:v2
          imagePullPolicy: Never      # the image is loaded into kind, not pulled
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: LLM_URL
              value: http://llm:8000       # the signboard, never a pod IP
            - name: QDRANT_URL
              value: http://qdrant:6333    # the slips live here now, not in the image
            - name: MIN_SCORE
              value: "0.68"
            - name: TOP_K
              value: "3"
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
          livenessProbe:              # am I alive? restart me if not
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:             # am I ready? send me traffic only then
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ask
spec:
  selector: { app: ask }
  ports:
    - port: 8080
      targetPort: 8080
      name: http
